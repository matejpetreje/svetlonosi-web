<!doctype html>
<html lang="cs">

<head>
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/favicon.png">


  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Světlonoši OBS Overlay</title>

  <link
    rel="stylesheet"
    href="../styles.css"
  >


  <style>

    /*
    ============================================================
    CELÁ PLOCHA OBS BROWSER SOURCE
    ============================================================
    */

    html,
    body {
      margin: 0 !important;
      padding: 0 !important;

      width: 100% !important;
      height: 100% !important;

      min-width: 0 !important;
      min-height: 0 !important;

      background: transparent !important;

      overflow: hidden !important;
    }


    body.stream-overlay-page {
      position: relative !important;

      margin: 0 !important;
      padding: 0 !important;

      width: 100% !important;
      height: 100% !important;

      background: transparent !important;

      overflow: hidden !important;

      display: block !important;
    }



    /*
    ============================================================
    HLAVNÍ KARTA HLASOVÁNÍ
    ============================================================

    DŮLEŽITÉ:

    top: 0
        = horní hrana Browser Source

    left: 50%
    translateX(-50%)
        = horizontální vycentrování

    NENÍ zde:
        bottom
        translateY
        flex centering
        vertical centering
        inset

    Karta tedy může růst POUZE DOLŮ.
    ============================================================
    */

    body.stream-overlay-page .stream-overlay-card {

      position: absolute !important;

      top: 0 !important;
      left: 50% !important;

      right: auto !important;
      bottom: auto !important;


      transform:
        translateX(-50%) !important;


      transform-origin:
        top center !important;


      /*
      Karta využije téměř celou šířku Browser Source,
      ale nepřeleze 940 px.
      */

      width: calc(100% - 32px) !important;
      max-width: 940px !important;


      /*
      Výška se vždy odvíjí pouze od obsahu.
      */

      height: auto !important;

      min-height: 0 !important;
      max-height: none !important;


      margin: 0 !important;


      padding:
        22px
        26px !important;


      box-sizing:
        border-box !important;


      display:
        block !important;


      overflow:
        visible !important;


      background:
        rgba(10, 12, 16, 0.94) !important;


      border:
        1px solid
        rgba(197, 139, 36, 0.50) !important;


      border-radius:
        18px !important;


      box-shadow:
        0 18px 60px
        rgba(0, 0, 0, 0.55) !important;


      opacity:
        1;


      transition:
        opacity 0.25s ease,
        transform 0.25s ease !important;
    }



    /*
    ============================================================
    SKRYTÝ OVERLAY
    ============================================================
    */

    body.stream-overlay-page
    .stream-overlay-card.stream-overlay-hidden {

      opacity: 0 !important;

      transform:
        translateX(-50%)
        translateY(-15px) !important;

      pointer-events:
        none !important;
    }



    /*
    ============================================================
    NADPIS
    ============================================================
    */

    .stream-overlay-kicker {

      color:
        #e7b95c !important;

      text-transform:
        uppercase;

      letter-spacing:
        0.18em;

      font-weight:
        900;

      font-size:
        0.8rem;
    }



    /*
    ============================================================
    OTÁZKA
    ============================================================
    */

    .stream-overlay-question {

      margin:
        7px 0 14px 0 !important;

      font-size:
        clamp(1.7rem, 3vw, 2.8rem);

      font-weight:
        900;

      overflow-wrap:
        anywhere !important;

      word-break:
        normal !important;
    }



    /*
    ============================================================
    ČAS
    ============================================================
    */

    .stream-overlay-timer {

      margin-bottom:
        10px;

      font-size:
        1.8rem;

      font-weight:
        900;

      color:
        #e7b95c;
    }



    /*
    ============================================================
    VÝSLEDKY
    ============================================================
    */

    .stream-overlay-results {

      display:
        grid !important;

      grid-template-columns:
        repeat(2, minmax(0, 1fr)) !important;

      gap:
        10px !important;

      align-content:
        start !important;

      width:
        100% !important;
    }



    .stream-overlay-result {

      box-sizing:
        border-box;

      padding:
        11px 13px;

      border:
        1px solid
        rgba(255, 255, 255, 0.09);

      border-radius:
        11px;

      background:
        rgba(255, 255, 255, 0.04);
    }



    .stream-overlay-result strong {

      display:
        flex;

      justify-content:
        space-between;

      gap:
        14px;
    }



    .stream-overlay-bar {

      height:
        6px;

      margin-top:
        7px;

      border-radius:
        999px;

      background:
        rgba(255, 255, 255, 0.08);

      overflow:
        hidden;
    }



    .stream-overlay-bar > div {

      height:
        100%;

      background:
        var(--accent);
    }



    /*
    ============================================================
    VÍTĚZ
    ============================================================
    */

    .stream-overlay-winner {

      margin-top:
        10px;

      font-size:
        clamp(2rem, 4vw, 3.5rem);

      font-weight:
        900;

      color:
        #e7b95c;
    }



    .stream-overlay-sub {

      margin-top:
        4px;

      color:
        var(--muted);
    }



    /*
    ============================================================
    UŽŠÍ BROWSER SOURCE
    ============================================================
    */

    @media (max-width: 760px) {

      .stream-overlay-results {

        grid-template-columns:
          1fr !important;

      }

    }

  </style>

</head>


<body class="stream-overlay-page">


  <main
    id="overlayCard"
    class="stream-overlay-card stream-overlay-hidden"
  >


    <div
      id="overlayTitle"
      class="stream-overlay-kicker"
    >
      HLAS SBORU SVĚTLONOŠŮ
    </div>


    <div
      id="overlayQuestion"
      class="stream-overlay-question"
    ></div>


    <div
      id="overlayTimer"
      class="stream-overlay-timer"
    ></div>


    <div
      id="overlayResults"
      class="stream-overlay-results"
    ></div>


    <div
      id="overlayWinner"
      class="stream-overlay-winner"
    ></div>


    <div
      id="overlaySub"
      class="stream-overlay-sub"
    ></div>


  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script
    src="../js/supabase-config.js"
  ></script>


  <script
    src="../js/overlay.js"
  ></script>


</body>

</html>
