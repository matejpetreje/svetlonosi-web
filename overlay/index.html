<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Světlonoši OBS Overlay</title>

  <link rel="stylesheet" href="../styles.css">

  <style>
    /*
      OBS OVERLAY — UKOTVENÍ OD HORNÍ HRANY

      Žádné fixed/absolute pozicování.
      Karta je první prvek dokumentu, takže její horní hrana
      je vždy horní hrana Browser Source a při větší výšce
      roste pouze směrem dolů.
    */

    html,
    body.stream-overlay-page {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-height: 100% !important;
      background: transparent !important;
      overflow: hidden !important;
    }

    body.stream-overlay-page {
      display: flex !important;
      flex-direction: column !important;
      justify-content: flex-start !important;
      align-items: center !important;
    }

    .stream-overlay-card {
      position: relative !important;

      top: auto !important;
      right: auto !important;
      bottom: auto !important;
      left: auto !important;
      inset: auto !important;

      transform: none !important;
      transform-origin: top center !important;

      width: min(940px, 94%) !important;
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;

      margin: 0 auto !important;

      display: block !important;
      overflow: visible !important;
      flex: 0 0 auto !important;
    }

    .stream-overlay-card.stream-overlay-hidden,
    .stream-overlay-hidden {
      opacity: 0 !important;
      transform: translateY(-18px) !important;
      pointer-events: none !important;
    }

    .stream-overlay-question {
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .stream-overlay-results {
      align-content: start;
    }
  </style>
</head>

<body class="stream-overlay-page">

  <main
    id="overlayCard"
    class="stream-overlay-card stream-overlay-hidden"
  >
    <div
      id="overlayTitle"
      class="stream-overlay-kicker"
    >
      HLAS SBORU SVĚTLONOŠŮ
    </div>

    <div
      id="overlayQuestion"
      class="stream-overlay-question"
    ></div>

    <div
      id="overlayTimer"
      class="stream-overlay-timer"
    ></div>

    <div
      id="overlayResults"
      class="stream-overlay-results"
    ></div>

    <div
      id="overlayWinner"
      class="stream-overlay-winner"
    ></div>

    <div
      id="overlaySub"
      class="stream-overlay-sub"
    ></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/overlay.js"></script>

</body>
</html>
