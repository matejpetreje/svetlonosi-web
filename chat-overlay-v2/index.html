<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Světlonoši — KICK Chat Overlay V2</title>

  <style>
    :root{
      --chat-text:#2b1a0c;
      --chat-name:#5a3216;
      --chat-shadow:rgba(255,244,216,.92);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:transparent!important;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color:
        var(--chat-text);
    }

    body{
      position:relative;
    }

    .chat-overlay{
      position:absolute;
      inset:0;

      display:flex;
      flex-direction:column;
      justify-content:flex-end;

      gap:6px;

      padding:
        14px
        16px;

      overflow:hidden;
    }

    .chat-message{
      flex:0 0 auto;
      width:100%;

      opacity:0;
      transform:translateY(8px);

      animation:
        chatIn
        .18s
        ease
        forwards;
    }

    .chat-line{
      display:flex;
      align-items:center;

      gap:5px;

      min-width:0;

      font-size:19px;
      line-height:1.25;
      font-weight:600;

      text-shadow:
        0 1px 0 var(--chat-shadow),
        0 0 2px rgba(255,244,216,.82);
    }

    .chat-jiskry-badge{
      width:20px;
      height:20px;

      flex:0 0 20px;

      display:inline-grid;
      place-items:center;

      overflow:hidden;

      border-radius:7px;
      vertical-align:middle;
    }

    .chat-jiskry-badge img{
      display:block;

      width:100%;
      height:100%;

      object-fit:cover;
      border-radius:inherit;

      filter:
        drop-shadow(
          0 1px 1px rgba(0,0,0,.35)
        );
    }

    .chat-jiskry-badge > span{
      display:grid;
      place-items:center;

      width:100%;
      height:100%;

      font-size:15px;
      line-height:1;
      font-weight:900;
    }

    .chat-username{
      flex:0 0 auto;
      max-width:42%;

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      color:var(--chat-name)!important;

      font-weight:800;
    }

    .chat-colon{
      flex:0 0 auto;

      color:var(--chat-text);
      font-weight:800;

      margin-left:-2px;
    }

    .chat-content{
      flex:1 1 auto;

      min-width:0;

      color:var(--chat-text);

      font-weight:600;

      overflow-wrap:anywhere;
      word-break:normal;
    }

    .kick-emote{
      display:inline-block;

      height:1.45em;
      width:auto;
      max-width:2.6em;

      object-fit:contain;

      vertical-align:-0.34em;

      margin:
        0
        2px;

      filter:
        drop-shadow(
          0 1px 1px rgba(0,0,0,.18)
        );
    }

    body.compact .chat-overlay{
      gap:4px;
      padding:10px 12px;
    }

    body.compact .chat-line{
      gap:4px;
      font-size:16px;
    }

    body.compact .chat-jiskry-badge{
      width:17px;
      height:17px;
      flex-basis:17px;
      border-radius:6px;
    }

    @keyframes chatIn{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>

<body data-chat-overlay-version="2026-09-29-v9-inline">
  <div
    class="chat-overlay"
    id="chatOverlay"
    aria-live="polite"
  ></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=20260929"></script>

  <script>
  (() => {
    window.SVETLONOSI_CHAT_OVERLAY_VERSION =
      "2026-09-29-v9-inline";

    console.log(
      "Světlonoši chat overlay:",
      window.SVETLONOSI_CHAT_OVERLAY_VERSION
    );

    const cfg =
      window.SVETLONOSI_CONFIG;

    if (
      !cfg
      ||
      !window.supabase
    ) {
      console.error(
        "Chybí Supabase config."
      );

      return;
    }

    const db =
      supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_ANON_KEY
      );

    const overlay =
      document.getElementById(
        "chatOverlay"
      );

    const params =
      new URLSearchParams(
        window.location.search
      );

    const HISTORY_MINUTES =
      Math.min(
        180,
        Math.max(
          0,
          Number(
            params.get("history")
            ??
            15
          )
        )
      );

    const DOM_LIMIT =
      Math.min(
        500,
        Math.max(
          50,
          Number(
            params.get("buffer")
            ||
            200
          )
        )
      );

    if (
      params.get("compact")
      ===
      "1"
    ) {
      document.body.classList.add(
        "compact"
      );
    }

    const seen =
      new Set();

    const esc =
      value =>
        String(
          value
          ??
          ""
        )
          .replaceAll(
            "&",
            "&amp;"
          )
          .replaceAll(
            "<",
            "&lt;"
          )
          .replaceAll(
            ">",
            "&gt;"
          )
          .replaceAll(
            '"',
            "&quot;"
          )
          .replaceAll(
            "'",
            "&#039;"
          );

    const rankBadgeFallback = {
      "Zbloudilá jiskra":
        "/assets/jiskry/badges/zbloudila-jiskra.png",

      "Jiskra":
        "/assets/jiskry/badges/jiskra.png",

      "Plamínek":
        "/assets/jiskry/badges/plaminek.png",

      "Pochodeň":
        "/assets/jiskry/badges/pochoden.png",

      "Světlonoš":
        "/assets/jiskry/badges/svetlonos.png",

      "Strážce plamene":
        "/assets/jiskry/badges/strazce-plamene.png",

      "Nositel světla":
        "/assets/jiskry/badges/nositel-svetla.png",

      "Věčný plamen":
        "/assets/jiskry/badges/vecny-plamen.png",

      "Maják Světlonošů":
        "/assets/jiskry/badges/majak-svetlonosu.png"
    };

    /*
     * Zachová KICK odstín, ale udělá jej tmavý pro pergamen.
     * Výstup má lightness 15–23 %, takže už nebude neonový.
     */
    function darkenKickColor(
      hex
    ) {
      if (
        !/^#[0-9a-fA-F]{6}$/
          .test(
            hex
            ||
            ""
          )
      ) {
        return "#5a3216";
      }

      const r =
        parseInt(
          hex.slice(
            1,
            3
          ),
          16
        );

      const g =
        parseInt(
          hex.slice(
            3,
            5
          ),
          16
        );

      const b =
        parseInt(
          hex.slice(
            5,
            7
          ),
          16
        );

      const max =
        Math.max(
          r,
          g,
          b
        );

      const min =
        Math.min(
          r,
          g,
          b
        );

      const delta =
        max
        -
        min;

      let h =
        0;

      if (
        delta
        !==
        0
      ) {
        if (
          max === r
        ) {
          h =
            (
              (
                g
                -
                b
              )
              /
              delta
            )
            %
            6;
        } else if (
          max === g
        ) {
          h =
            (
              b
              -
              r
            )
            /
            delta
            +
            2;
        } else {
          h =
            (
              r
              -
              g
            )
            /
            delta
            +
            4;
        }

        h *=
          60;

        if (
          h < 0
        ) {
          h +=
            360;
        }
      }

      const sat =
        Math.max(
          48,
          Math.min(
            76,
            delta
            /
            Math.max(
              1,
              max
            )
            *
            100
          )
        );

      const light =
        19;

      return `hsl(${h.toFixed(1)} ${sat.toFixed(0)}% ${light}%)`;
    }

    function badgeMarkup(
      message
    ) {
      if (
        !message.jiskry_badge_name
      ) {
        return "";
      }

      const title =
        esc(
          message.jiskry_badge_name
        );

      const imageUrl =
        message.jiskry_badge_static_url
        ||
        rankBadgeFallback[
          message.jiskry_badge_name
        ]
        ||
        null;

      if (imageUrl) {
        return `
          <span
            class="chat-jiskry-badge"
            title="${title}"
          >
            <img
              src="${esc(imageUrl)}"
              alt=""
            >
          </span>
        `;
      }

      return `
        <span
          class="chat-jiskry-badge"
          title="${title}"
        >
          <span>
            ${esc(
              message.jiskry_badge_glyph
              ||
              "✦"
            )}
          </span>
        </span>
      `;
    }

    /*
     * KICK zpráva:
     * [emote:3753119:asmonSmash]
     *
     * Hlavní CDN:
     * files.kick.com/emotes/{ID}/fullsize
     *
     * Fallback:
     * d2egosedh0nm8l.cloudfront.net/emotes/{ID}/fullsize
     */
    function renderKickContent(
      value
    ) {
      const source =
        String(
          value
          ??
          ""
        );

      const regex =
        /\[emote:(\d+):([^\]]+)\]/g;

      let output =
        "";

      let last =
        0;

      let match;

      while (
        (
          match =
            regex.exec(
              source
            )
        )
        !==
        null
      ) {
        output +=
          esc(
            source.slice(
              last,
              match.index
            )
          );

        const id =
          match[1];

        const name =
          match[2];

        const primary =
          `https://files.kick.com/emotes/${id}/fullsize`;

        const fallback =
          `https://d2egosedh0nm8l.cloudfront.net/emotes/${id}/fullsize`;

        output += `
          <img
            class="kick-emote"
            src="${primary}"
            alt=":${esc(name)}:"
            title="${esc(name)}"
            data-fallback="${fallback}"
            onerror="
              if(!this.dataset.usedFallback){
                this.dataset.usedFallback='1';
                this.src=this.dataset.fallback;
              } else {
                this.style.display='none';
              }
            "
          >
        `;

        last =
          regex.lastIndex;
      }

      output +=
        esc(
          source.slice(
            last
          )
        );

      return output;
    }

    function renderMessage(
      message,
      animate = true
    ) {
      const id =
        String(
          message.id
          ||
          message.kick_message_id
          ||
          message.event_message_id
          ||
          ""
        );

      if (
        !id
        ||
        seen.has(id)
      ) {
        return;
      }

      seen.add(id);

      const element =
        document.createElement(
          "div"
        );

      element.className =
        "chat-message";

      element.dataset.messageId =
        id;

      const username =
        message.sender_username
        ||
        "KICK";

      const usernameColor =
        darkenKickColor(
          message.sender_username_color
        );

      element.innerHTML = `
        <div class="chat-line">

          ${badgeMarkup(message)}

          <span
            class="chat-username"
            style="color:${usernameColor}!important"
          >
            ${esc(username)}
          </span>

          <span class="chat-colon">:</span>

          <span class="chat-content">
            ${renderKickContent(
              message.content
            )}
          </span>

        </div>
      `;

      if (!animate) {
        element.style.animation =
          "none";

        element.style.opacity =
          "1";

        element.style.transform =
          "none";
      }

      overlay.appendChild(
        element
      );

      trimDomBuffer();
    }

    function trimDomBuffer() {
      const messages =
        [
          ...overlay.querySelectorAll(
            ".chat-message"
          )
        ];

      while (
        messages.length
        >
        DOM_LIMIT
      ) {
        const oldest =
          messages.shift();

        if (oldest) {
          const id =
            oldest.dataset.messageId;

          if (id) {
            seen.delete(id);
          }

          oldest.remove();
        }
      }
    }

    async function loadInitial() {
      if (
        HISTORY_MINUTES <=
        0
      ) {
        return;
      }

      const cutoff =
        new Date(
          Date.now()
          -
          HISTORY_MINUTES
          *
          60
          *
          1000
        )
          .toISOString();

      const {
        data,
        error
      } =
        await db
          .from(
            "kick_chat_overlay_messages"
          )
          .select("*")
          .gte(
            "received_at",
            cutoff
          )
          .order(
            "received_at",
            {
              ascending:
                true
            }
          )
          .limit(
            DOM_LIMIT
          );

      if (error) {
        console.error(
          "Chat overlay initial:",
          error
        );

        return;
      }

      (
        data
        ||
        []
      )
        .forEach(
          message =>
            renderMessage(
              message,
              false
            )
        );
    }

    db
      .channel(
        "kick-chat-overlay-v9-inline"
      )
      .on(
        "postgres_changes",
        {
          event:
            "INSERT",

          schema:
            "public",

          table:
            "kick_chat_overlay_messages"
        },
        payload => {
          renderMessage(
            payload.new,
            true
          );
        }
      )
      .subscribe(
        status => {
          console.log(
            "KICK chat realtime:",
            status
          );
        }
      );

    loadInitial();
  })();
  </script>
</body>
</html>
