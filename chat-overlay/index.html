<!doctype html>
<html lang="cs">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Světlonoši — KICK Chat Overlay</title>

  <style>
    :root{
      --chat-text:#2b1a0c;
      --chat-name:#7a2b15;
      --chat-shadow:rgba(255,244,216,.92);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;

      background:transparent!important;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color:
        var(--chat-text);
    }

    body{
      position:relative;
    }

    .chat-overlay{
      position:absolute;
      inset:0;

      display:flex;
      flex-direction:column;
      justify-content:flex-end;

      gap:6px;

      padding:
        14px
        16px;

      overflow:hidden;
    }

    .chat-message{
      flex:0 0 auto;

      width:100%;

      opacity:0;

      transform:
        translateY(8px);

      animation:
        chatIn
        .18s
        ease
        forwards;
    }

    .chat-line{
      display:flex;
      align-items:center;

      gap:5px;

      min-width:0;

      font-size:19px;
      line-height:1.25;

      font-weight:600;

      text-shadow:
        0 1px 0 var(--chat-shadow),
        0 0 2px rgba(255,244,216,.82);
    }

    .chat-jiskry-badge{
      width:20px;
      height:20px;

      flex:
        0 0 20px;

      display:inline-grid;
      place-items:center;

      overflow:hidden;

      border-radius:4px;

      vertical-align:middle;
    }

    .chat-jiskry-badge img{
      display:block;

      width:100%;
      height:100%;

      object-fit:contain;

      filter:
        drop-shadow(
          0 1px 1px rgba(0,0,0,.35)
        );
    }

    .chat-jiskry-badge > span{
      display:grid;
      place-items:center;

      width:100%;
      height:100%;

      font-size:15px;
      line-height:1;

      font-weight:900;

      filter:
        drop-shadow(
          0 1px 1px rgba(0,0,0,.25)
        );
    }

    .chat-username{
      flex:
        0 0 auto;

      max-width:42%;

      overflow:hidden;
      text-overflow:ellipsis;

      white-space:nowrap;

      color:
        var(--chat-name);

      font-weight:800;
    }

    .chat-colon{
      flex:0 0 auto;

      color:
        var(--chat-text);

      font-weight:800;

      margin-left:-2px;
    }

    .chat-content{
      flex:
        1 1 auto;

      min-width:0;

      color:
        var(--chat-text);

      font-weight:600;

      overflow-wrap:anywhere;
      word-break:normal;
    }

    .spark-accent-gold{color:#b47b15}
    .spark-accent-ash{color:#756a5b}
    .spark-accent-ember{color:#b45d27}
    .spark-accent-blue{color:#3d78a2}
    .spark-accent-green{color:#3f7d55}
    .spark-accent-purple{color:#76519d}
    .spark-accent-red{color:#a74343}
    .spark-accent-light{color:#b28c2a}
    .spark-accent-legendary{color:#b98616}

    body.compact .chat-overlay{
      gap:4px;
      padding:10px 12px;
    }

    body.compact .chat-line{
      gap:4px;
      font-size:16px;
    }

    body.compact .chat-jiskry-badge{
      width:17px;
      height:17px;
      flex-basis:17px;
    }

    body.compact .chat-jiskry-badge > span{
      font-size:13px;
    }

    @keyframes chatIn{
      to{
        opacity:1;

        transform:
          translateY(0);
      }
    }
  </style>
</head>

<body>

  <div
    class="chat-overlay"
    id="chatOverlay"
    aria-live="polite"
  ></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/chat-overlay.js"></script>

</body>

</html>
